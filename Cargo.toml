[package]
name = "top-collectd-plugin"
version = "0.2.0"
authors = ["Jon Williams"]
edition = "2021"
description = "A collectd plugin that reports top processes by CPU usage"
license = "MIT"
repository = "https://github.com/abedegno/top-collectd"

[lib]
name = "top"
crate-type = ["cdylib"]

[dependencies]
collectd-plugin = "0.15.0"
glob = "0.3.3"
num_cpus = "1.17.0"
