# Collectd configuration for CGP testing (RRD output)

Hostname "test-host"

Interval 10

# Load the top plugin (our Rust plugin)
LoadPlugin top

# Write output to RRD files for CGP
LoadPlugin rrdtool

<Plugin rrdtool>
    DataDir "/var/lib/collectd/rrd"
    CreateFilesAsync false
    CacheTimeout 10
    CacheFlush 30
</Plugin>
